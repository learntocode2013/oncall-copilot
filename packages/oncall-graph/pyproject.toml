[project]
name = "oncall-graph"
version = "0.1.0"
description = "P2 — incident commander, specialists, planning, improvement loop."
requires-python = ">=3.12"
dependencies = [
    "oncall-contracts",
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
oncall-contracts = { workspace = true }
