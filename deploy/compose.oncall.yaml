# Our services and compatibility fixes layered onto the Astronomy Shop.
# Every service added here must add its health check to `make verify` in the
# same commit so `make up --wait` remains trustworthy.
#
# Relative paths here must be ${ONCALL_ROOT}-rooted: Compose resolves
# relative paths in EVERY -f file against the FIRST file's directory, which
# is the demo repo, not ours. --project-directory cannot fix that without
# breaking the demo's own paths.
services:
  oncall-service:
    build:
      context: ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}
      dockerfile: packages/oncall-service/Dockerfile
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ONCALL_SERVICE_HOST: 0.0.0.0
      ONCALL_SERVICE_PORT: "8000"
      ONCALL_CORS_ORIGINS: ${ONCALL_CORS_ORIGINS:-}
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686/jaeger/ui
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      - prometheus
      - jaeger
      - opensearch
    ports:
      - "8000:8000"
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Operator lab. It is a separate process so the incident console on port
  # 8000 never sees the fault's root cause. Arm writes the same flag file
  # flagd reloads. Page posts a symptom to the incident API over HTTP.
  oncall-lab:
    build:
      context: ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}
      dockerfile: packages/oncall-lab/Dockerfile
    environment:
      ONCALL_LAB_HOST: 0.0.0.0
      ONCALL_LAB_PORT: "8020"
      ONCALL_MANIFEST: /lab/manifest.yaml
      FLAGD_CONFIG: /etc/flagd/demo.flagd.json
      ONCALL_ALERTS_URL: http://oncall-service:8000/alerts
      ONCALL_CONSOLE_URL: http://localhost:8000/
    volumes:
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/eval/faults/manifest.yaml:/lab/manifest.yaml:ro
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/flagd:/etc/flagd
    depends_on:
      oncall-service:
        condition: service_healthy
      flagd:
        condition: service_started
    ports:
      - "8020:8020"
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8020/healthz', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Grafana already runs in the demo. Our rule is copied into a private
  # provisioning directory by deploy/grafana/start.sh. Do not mount the file
  # under /etc/grafana/provisioning: that path is the demo's bind mount, and
  # Docker Desktop rejects a file mount inside it.
  grafana:
    environment:
      - GF_PATHS_PROVISIONING=/tmp/grafana-provisioning
    entrypoint: ["/bin/sh", "/oncall/start.sh"]
    volumes:
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/grafana/provisioning/alerting/oncall-copilot.yaml:/oncall/oncall-copilot.yaml:ro
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/grafana/start.sh:/oncall/start.sh:ro

  # UPSTREAM BUG, pinned tag 3.1.0: the health check runs
  #   nc -z localhost ${RECOMMENDATION_PORT}
  # but `nc` is not in the image, so it fails with
  #   /bin/sh: 1: nc: not found
  # and can never pass. `frontend` requires recommendation to be
  # service_healthy, so frontend and frontend-proxy never start and port
  # 8080 stays unbound — the whole shop is unreachable.
  #
  # The service itself is fine. Verified inside the container:
  #   bash -c 'echo > /dev/tcp/localhost/9001'  -> exit 0  (listening)
  #   bash -c 'echo > /dev/tcp/localhost/9999'  -> exit 1  (control)
  #
  # This is upstream's own fix from main, which 3.1.0 predates. 3.1.0 is the
  # newest tag, so there is nothing to bump to; main is 130 commits ahead and
  # we keep the pin rather than trade a known bug for unknown ones.
  # `bash` is at /usr/bin/bash; `sh` is dash and cannot do /dev/tcp, so the
  # probe must invoke bash explicitly.
  #
  # REMOVE THIS once the pin moves to a release that includes the fix.
  # Rationale and alternatives considered:
  #   docs/decisions/0001-patch-recommendation-healthcheck.md
  recommendation:
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/${RECOMMENDATION_PORT}'"]
      start_period: 20s

  # UPSTREAM BUG, pinned tag 3.1.0: product-catalog ships a 20M container cap
  # with GOMEMLIMIT=16MiB, but its real working set is ~28 MiB. GOMEMLIMIT is a
  # SOFT limit, so instead of being OOM-killed the Go runtime garbage-collects
  # continuously trying to stay under a ceiling it cannot fit beneath. It burns
  # cores making no forward progress and never binds :3550, so its health check
  # never passes.
  #
  # Measured, before and after raising the ceiling:
  #   before:  unhealthy (failing streak 45)   CPU 623%    mem 16.89/20 MiB (84%)
  #   after:   healthy                         CPU 2.83%   mem 27.69/128 MiB
  #
  # A 220x CPU reduction. The symptom is intermittent — startup sometimes won
  # the race — which is why it appeared to "recover" on a recreate.
  #
  # 64M/48MiB keeps upstream's ~80% GOMEMLIMIT-to-cap ratio while clearing the
  # ~28 MiB the service actually needs.
  #
  # Rationale and alternatives considered:
  #   docs/decisions/0002-raise-product-catalog-memory-ceiling.md
  # REMOVE THIS once upstream raises the limit.
  product-catalog:
    environment:
      - GOMEMLIMIT=48MiB
    deploy:
      resources:
        limits:
          memory: 64M

  # Own the flag file instead of writing into the pinned submodule.
  #
  # Upstream mounts ./src/flagd into both flagd and flagd-ui, and the UI WRITES
  # to it — so every fault injection would dirty vendor/opentelemetry-demo and
  # make `git submodule status` permanently modified. The pin would stop
  # meaning anything.
  #
  # Compose merges volumes by mount target, so these replace the upstream
  # mounts rather than adding to them. Confirm with `make config`.
  #
  # deploy/flagd/demo.flagd.json is our versioned baseline. P4's fault
  # injector edits THIS file; flagd hot-reloads it.
  flagd:
    volumes:
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/flagd:/etc/flagd

  flagd-ui:
    volumes:
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/flagd:/app/data

  # SAME UPSTREAM BUG AS product-catalog, different service. See ADR-0002.
  #
  # checkout ships a 20M cap with GOMEMLIMIT=16MiB. Under load its heap reaches
  # the soft limit and the Go runtime collects continuously instead of being
  # OOM-killed. Measured at 25 concurrent users:
  #   mem 19.14/20 MiB (95.68%)   cpu 267.80%
  #
  # The downstream effect is worse than for product-catalog, because every
  # order passes through checkout:
  #   stalled requests -> Envoy returns 504 (the frontend never responded)
  #   -> NO http_server_request_duration_seconds_count sample is recorded
  #   -> the 422 series never increments
  #   -> deploy/prometheus/rules/checkout.yaml can never fire
  #
  # Locust confirmed the shape: POST /api/checkout failed 504 x93, 500 x22,
  # 422 x3. The alert rule was never wrong — the shop was too broken to
  # produce the error the rule alerts on.
  #
  # 64M/48MiB matches product-catalog and upstream's ~80% ratio.
  # REMOVE THIS once upstream raises the limit.
  checkout:
    environment:
      - GOMEMLIMIT=48MiB
    deploy:
      resources:
        limits:
          memory: 64M

  # OUR SERVICE. Read-only runbook search, the MCP half of P1's retrieval layer.
  # Written by P1 while P3 is on leave; oncall-tools is P3's package.
  #
  # Build context is ${ONCALL_ROOT}, not packages/oncall-tools/: uv resolves a
  # workspace member against the ROOT pyproject.toml and uv.lock, so the
  # Dockerfile needs both. See the path-resolution note at the top of this file
  # for why it must be ${ONCALL_ROOT}-rooted rather than relative.
  mcp-runbooks:
    build:
      context: ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}
      dockerfile: packages/oncall-tools/Dockerfile
    container_name: mcp-runbooks
    ports:
      - "8102:8102"
    # A TCP probe, not an MCP call. It proves the port is bound and nothing
    # more: MCP's streamable-http endpoint needs specific headers and a POST,
    # so a GET-based check would report unhealthy on a working server. `sh` is
    # dash in this image and cannot do /dev/tcp, so bash is invoked explicitly
    # -- the same reason the recommendation patch above does.
    #
    # It will NOT catch a server that binds the port and then fails to answer.
    # `make verify` makes a real HTTP request for that.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8102'"]
      interval: 10s
      timeout: 3s
      retries: 5
      # The retriever builds at startup -- ingest 18 runbooks, load an 80 MB
      # model from the image, embed the corpus -- BEFORE the port is bound, so
      # a healthy container means retrieval actually works. Measured: the port
      # answered in 2s while the retriever was still lazy, which is why
      # build_server now warms it eagerly. Keep start_period generous: an
      # unhealthy verdict during model load would be wrong, not useful.
      start_period: 60s
    restart: unless-stopped

  # THE ONLY WRITE SERVER. Network reachability is not the control: in this mode
  # mcp-ops-actions is just another container on this network and any agent
  # could reach it. What stops a diagnosis agent calling it is
  # `permissions.for_role`, which never puts a write tool in a diagnosis
  # registry, and `hooks.pre_tool`, which refuses an unapproved write.
  mcp-ops-actions:
    build:
      context: ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}
      dockerfile: packages/oncall-tools/Dockerfile.ops-actions
    container_name: mcp-ops-actions
    ports:
      - "8104:8104"
    environment:
      FLAGD_CONFIG: /etc/flagd/demo.flagd.json
    volumes:
      # READ-WRITE, unlike every other mount in this overlay. This server exists
      # to edit the document flagd watches, and the same file is what the lab
      # edits to inject a fault -- the two write it with opposite intent. See
      # oncall_contracts.flagd for why the writer is shared.
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/flagd:/etc/flagd
    # A TCP probe, not an MCP call: MCP's streamable-http endpoint needs a POST
    # with specific headers, so a GET-based check reports unhealthy on a working
    # server. `sh` is dash in this image and cannot do /dev/tcp, so bash is
    # invoked explicitly.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8104'"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Shorter than mcp-runbooks' 60s: this server loads no model. It ingests
      # 18 runbooks and reads one JSON document before binding, so a healthy
      # container means the corpus validated and the flag file is readable.
      start_period: 20s
    restart: unless-stopped
