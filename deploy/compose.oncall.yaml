# Our overlay onto the Astronomy Shop.
#
# LAYER 1: it carries only an upstream bug fix. Our own services
# (incident-api, the four MCP servers) join here once their modules exist —
# and each one's health check joins `make verify` in the SAME commit.
#
# Relative paths here must be ${ONCALL_ROOT}-rooted: Compose resolves
# relative paths in EVERY -f file against the FIRST file's directory, which
# is the demo repo, not ours. --project-directory cannot fix that without
# breaking the demo's own paths.
services:
  # UPSTREAM BUG, pinned tag 3.1.0: the health check runs
  #   nc -z localhost ${RECOMMENDATION_PORT}
  # but `nc` is not in the image, so it fails with
  #   /bin/sh: 1: nc: not found
  # and can never pass. `frontend` requires recommendation to be
  # service_healthy, so frontend and frontend-proxy never start and port
  # 8080 stays unbound — the whole shop is unreachable.
  #
  # The service itself is fine. Verified inside the container:
  #   bash -c 'echo > /dev/tcp/localhost/9001'  -> exit 0  (listening)
  #   bash -c 'echo > /dev/tcp/localhost/9999'  -> exit 1  (control)
  #
  # This is upstream's own fix from main, which 3.1.0 predates. 3.1.0 is the
  # newest tag, so there is nothing to bump to; main is 130 commits ahead and
  # we keep the pin rather than trade a known bug for unknown ones.
  # `bash` is at /usr/bin/bash; `sh` is dash and cannot do /dev/tcp, so the
  # probe must invoke bash explicitly.
  #
  # REMOVE THIS once the pin moves to a release that includes the fix.
  # Rationale and alternatives considered:
  #   docs/decisions/0001-patch-recommendation-healthcheck.md
  recommendation:
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/${RECOMMENDATION_PORT}'"]
      start_period: 20s

  # UPSTREAM BUG, pinned tag 3.1.0: product-catalog ships a 20M container cap
  # with GOMEMLIMIT=16MiB, but its real working set is ~28 MiB. GOMEMLIMIT is a
  # SOFT limit, so instead of being OOM-killed the Go runtime garbage-collects
  # continuously trying to stay under a ceiling it cannot fit beneath. It burns
  # cores making no forward progress and never binds :3550, so its health check
  # never passes.
  #
  # Measured, before and after raising the ceiling:
  #   before:  unhealthy (failing streak 45)   CPU 623%    mem 16.89/20 MiB (84%)
  #   after:   healthy                         CPU 2.83%   mem 27.69/128 MiB
  #
  # A 220x CPU reduction. The symptom is intermittent — startup sometimes won
  # the race — which is why it appeared to "recover" on a recreate.
  #
  # 64M/48MiB keeps upstream's ~80% GOMEMLIMIT-to-cap ratio while clearing the
  # ~28 MiB the service actually needs.
  #
  # Rationale and alternatives considered:
  #   docs/decisions/0002-raise-product-catalog-memory-ceiling.md
  # REMOVE THIS once upstream raises the limit.
  product-catalog:
    environment:
      - GOMEMLIMIT=48MiB
    deploy:
      resources:
        limits:
          memory: 64M

  # Own the flag file instead of writing into the pinned submodule.
  #
  # Upstream mounts ./src/flagd into both flagd and flagd-ui, and the UI WRITES
  # to it — so every fault injection would dirty vendor/opentelemetry-demo and
  # make `git submodule status` permanently modified. The pin would stop
  # meaning anything.
  #
  # Compose merges volumes by mount target, so these replace the upstream
  # mounts rather than adding to them. Confirm with `make config`.
  #
  # deploy/flagd/demo.flagd.json is our versioned baseline. P4's fault
  # injector edits THIS file; flagd hot-reloads it.
  flagd:
    volumes:
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/flagd:/etc/flagd

  flagd-ui:
    volumes:
      - ${ONCALL_ROOT:?set ONCALL_ROOT to the repo root}/deploy/flagd:/app/data

  # SAME UPSTREAM BUG AS product-catalog, different service. See ADR-0002.
  #
  # checkout ships a 20M cap with GOMEMLIMIT=16MiB. Under load its heap reaches
  # the soft limit and the Go runtime collects continuously instead of being
  # OOM-killed. Measured at 25 concurrent users:
  #   mem 19.14/20 MiB (95.68%)   cpu 267.80%
  #
  # The downstream effect is worse than for product-catalog, because every
  # order passes through checkout:
  #   stalled requests -> Envoy returns 504 (the frontend never responded)
  #   -> NO http_server_request_duration_seconds_count sample is recorded
  #   -> the 422 series never increments
  #   -> deploy/prometheus/rules/checkout.yaml can never fire
  #
  # Locust confirmed the shape: POST /api/checkout failed 504 x93, 500 x22,
  # 422 x3. The alert rule was never wrong — the shop was too broken to
  # produce the error the rule alerts on.
  #
  # 64M/48MiB matches product-catalog and upstream's ~80% ratio.
  # REMOVE THIS once upstream raises the limit.
  checkout:
    environment:
      - GOMEMLIMIT=48MiB
    deploy:
      resources:
        limits:
          memory: 64M
