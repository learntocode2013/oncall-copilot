[project]
name = "oncall-copilot"
version = "0.1.0"
description = "On-Call Copilot — agentic incident response for the OTel Astronomy Shop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "oncall-contracts",
    "oncall-eval",
    "oncall-knowledge",
    "oncall-graph",
    "oncall-lab",
    "oncall-service",
    "oncall-tools",
]

# `uv sync --extra NAME` resolves extras against THIS project, not against a
# workspace member -- so oncall-knowledge's own `semantic` extra is unreachable
# from the repo root without this forwarding entry. It stays out of
# `dependencies` above so a plain `uv sync` (and CI's `uv sync --frozen`) never
# installs torch.
#
#   uv sync                     lint, test, guards: no torch, ~seconds
#   uv sync --extra semantic    adds sentence-transformers + torch, ~2 GB
[project.optional-dependencies]
semantic = ["oncall-knowledge[semantic]"]

# torch's default PyPI wheel for Linux is the CUDA build: it hard-depends on
# cuda-toolkit, cuda-bindings and 15 nvidia-* packages, which are GPU kernels
# no container in this stack has and `all-MiniLM-L6-v2` over 18 documents never
# touches. Measured: they are most of a 6.42 GB mcp-runbooks image.
#
# `explicit = true` means this index serves only the packages assigned to it
# below -- nothing else in the tree silently starts resolving from
# download.pytorch.org.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
oncall-contracts = { workspace = true }
oncall-eval = { workspace = true }
oncall-knowledge = { workspace = true }
oncall-graph = { workspace = true }
oncall-lab = { workspace = true }
oncall-service = { workspace = true }
oncall-tools = { workspace = true }

# Linux only, and the marker matters. macOS has no CUDA torch on PyPI, so the
# dev machines that produced artifacts/retrieval/ were already running a
# CPU-only build; pinning without the marker would send darwin to an index it
# does not need, and pinning the wrong way round would change the torch
# underneath the committed before/after numbers.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# importlib mode keeps test directories off sys.path, so identically named test
# modules in sibling packages do not collide. Without it, two files both named
# tests/test_import.py abort the WHOLE run with "import file mismatch:
# Interrupted: 1 error during collection" — not just that file. Verified.
addopts = "--import-mode=importlib"
pythonpath = []

[tool.ruff]
line-length = 100
target-version = "py312"
# vendor/ is the pinned OpenTelemetry demo submodule — ~7500 files of someone
# else's code. Without this, `ruff check .` reports 118 errors in it and
# `make lint` fails on a clean clone. Not ours to lint or format.
extend-exclude = ["vendor"]
